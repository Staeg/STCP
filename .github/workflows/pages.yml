# Publishes the solo build (you + 3 bots, no server) to GitHub Pages on every push to main, with the `cards` branch's
# build alongside it at /beta (https://staeg.github.io/STCP/beta/). A push to `cards` asks for a redeploy (beta.yml).
name: Deploy solo build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history: the menu's patch notes list each push's commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SOLO: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The beta: the `cards` branch, built the same way into /beta, with its own save slot in the browser.
      - id: beta
        run: git ls-remote --exit-code --heads origin cards && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - if: steps.beta.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: cards
          path: beta-src
          fetch-depth: 0
      - if: steps.beta.outputs.exists == 'true'
        working-directory: beta-src
        run: npm ci && npm run build
        env:
          VITE_SOLO: '1'
          VITE_STASH_KEY: stcp-stash-beta
          GITHUB_REF_NAME: cards # the build tag names the branch it came from (the run itself is on main)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.beta.outputs.exists == 'true'
        run: rm -rf client/dist/beta && cp -r beta-src/client/dist client/dist/beta
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4
