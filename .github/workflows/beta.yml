# A push to the `cards` branch (the beta) asks main's Pages workflow to redeploy, which builds this branch into
# /beta. Only main deploys, so the live site and the beta are always published together.
name: Redeploy the beta

on:
  push:
    branches: [cards]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
