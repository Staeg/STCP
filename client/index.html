<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>So They Can Prosper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud">
      <div class="panel" id="clock-panel">
        <div id="clock">00:00</div>
        <div id="tier">Tier 0</div>
        <div id="next-event"></div>
        <div id="objectives" class="muted small"></div>
        <div id="roster"></div>
      </div>
      <div class="panel" id="status-panel">
        <div id="hero-name"></div>
        <div id="affliction" hidden></div>
        <div id="escort" hidden></div>
        <div class="bar-label">HP <span id="hp-text"></span></div>
        <div class="bar"><div class="bar-fill hp" id="hp-fill"></div></div>
        <div class="bar-label">Stress <span id="stress-text"></span></div>
        <div class="bar"><div class="bar-fill stress" id="stress-fill"></div></div>
        <div class="bar-label">Light <span id="light-text"></span></div>
        <div class="bar"><div class="bar-fill" id="light-fill"></div></div>
        <div id="location"></div>
        <div id="inventory"></div>
      </div>
    </div>
    <div id="actions">
      <button id="btn-turn" hidden>⟲ Turn back <kbd>Space</kbd></button>
      <button id="btn-revive" hidden></button>
      <button id="btn-dig" hidden></button>
      <button id="btn-mend" hidden></button>
      <button id="btn-escape" hidden class="primary"></button>
      <div id="channel" hidden></div>
      <button id="btn-lobby" hidden>Return to lobby</button>
    </div>
    <div id="help">Click a room to walk there · Space: turn back · 4–7: use item · R: revive · D: dig · M: mend · E: escape</div>
    <div id="net">connecting…</div>
    <div id="banner" hidden></div>
    <div id="combat" hidden></div>
    <div id="results" hidden></div>
    <div id="loot" hidden></div>
    <div id="event" hidden></div>
    <div id="feed"></div>
    <div id="screen"></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
