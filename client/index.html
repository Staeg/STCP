<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>So They Can Prosper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud">
      <div class="panel" id="clock-panel">
        <div id="clock">00:00</div>
        <div id="tier">Tier 0</div>
        <div id="next-event"></div>
        <div id="objectives" class="muted small"></div>
        <div id="roster"></div>
      </div>
      <div class="panel" id="status-panel">
        <div id="hero-name"></div>
        <div id="affliction" hidden></div>
        <div id="escort" hidden></div>
        <div class="bar-label"><span data-icon="hp"></span> <span id="hp-text"></span></div>
        <div class="bar"><div class="bar-fill hp" id="hp-fill"></div></div>
        <div class="bar-label"><span data-icon="stress"></span> <span id="stress-text"></span></div>
        <div class="bar"><div class="bar-fill stress" id="stress-fill"></div></div>
        <div class="bar-label"><span data-icon="light"></span> <span id="light-text"></span></div>
        <div class="bar"><div class="bar-fill" id="light-fill"></div></div>
        <div class="bar-label" id="speed-line"><span data-icon="speed"></span> <span id="speed-text"></span></div>
        <div id="location"></div>
        <div id="inventory"></div>
      </div>
    </div>
    <div id="actions">
      <button id="btn-turn" hidden>⟲ Turn back <kbd>Space</kbd></button>
      <button id="btn-revive" hidden></button>
      <div id="skills" hidden></div>
      <button id="btn-escape" hidden class="primary"></button>
      <div id="channel" hidden></div>
      <button id="btn-lobby" hidden>Return to lobby</button>
    </div>
    <div id="help" class="has-tip">?<div class="hover-tip">
      <div><b>Click a room</b>: walk there</div>
      <div><b>WASD</b>: move one room</div>
      <div><b>Space</b>: turn back in a tunnel</div>
      <div><b>Esc</b>: stop walking</div>
      <div><b>1, 2, 3…</b>: abilities in a fight · event and vote choices</div>
      <div><b>4–7</b>: use an item</div>
      <div><b>R</b>: revive · <b>B</b>: brace</div>
      <div><b>F</b>: flee a fight · escape at the open exit</div>
      <div><b>M</b>: class skill</div>
    </div></div>
    <div id="net">connecting…</div>
    <div id="banner" hidden></div>
    <div id="combat" hidden></div>
    <div id="results" hidden></div>
    <div id="loot" hidden></div>
    <div id="event" hidden></div>
    <div id="feed"></div>
    <div id="flash"></div>
    <div id="screen"></div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
